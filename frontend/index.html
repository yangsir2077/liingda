<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>零搭 - 可视化管理系统构建平台</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --primary-light: #EEF2FF;
      --accent: #10B981;
      --danger: #EF4444;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
    }
    body.dark-mode {
      --bg: #0F172A;
      --surface: #1E293B;
      --text: #F1F5F9;
      --text-secondary: #94A3B8;
      --border: #334155;
      --primary-light: #1E1B4B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #app { min-height: 100vh; }
    /* 登录/注册页面 */
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo h1 { font-size: 28px; color: var(--primary); margin-bottom: 4px; }
    .auth-logo p { color: var(--text-secondary); font-size: 14px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .auth-step { display: flex; align-items: center; gap: 6px; }
    .auth-step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--border); color: var(--text-secondary); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .auth-step.active .auth-step-num { background: var(--primary); color: #fff; }
    .auth-step.done .auth-step-num { background: var(--accent); color: #fff; }
    .auth-step-label { font-size: 13px; color: var(--text-secondary); }
    .auth-step.active .auth-step-label { color: var(--primary); font-weight: 600; }
    .auth-step.done .auth-step-label { color: var(--accent); }
    .auth-step-line { flex: 1; height: 1px; background: var(--border); margin: 0 8px; min-width: 24px; }
    .auth-steps { display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--text-secondary); background: var(--bg); transition: all 0.2s; }
    .auth-tab.active { background: var(--primary); color: white; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: var(--text); }
    .form-group input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; transition: border-color 0.2s; outline: none; }
    .form-group input:focus { border-color: var(--primary); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-block { width: 100%; }
    /* 管理后台 */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .sidebar-logo h2 { font-size: 18px; color: var(--primary); }
    .sidebar-logo span { font-size: 12px; color: var(--text-secondary); }
    .sidebar-nav { padding: 0 12px; }
    .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-size: 14px; transition: all 0.15s; margin-bottom: 2px; }
    .sidebar-item:hover { background: var(--bg); color: var(--text); }
    .sidebar-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .main-content { flex: 1; overflow: auto; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 18px; font-weight: 700; }
    .page-content { padding: 24px; }
    /* 卡片网格 */
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .app-card { background: var(--surface); border-radius: 12px; padding: 20px; border: 1.5px solid var(--border); cursor: pointer; transition: all 0.2s; }
    .app-card:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(79,70,229,0.1); transform: translateY(-2px); }
    .app-card-icon { width: 48px; height: 48px; background: var(--primary-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px; }
    .app-card-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .app-card-desc { font-size: 13px; color: var(--text-secondary); }
    .app-card-meta { margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
    /* 新建应用 */
    .new-app-card { background: var(--bg); border-radius: 12px; padding: 20px; border: 2px dashed var(--border); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; color: var(--text-secondary); transition: all 0.2s; }
    .new-app-card:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .new-app-card i { font-size: 28px; margin-bottom: 8px; }
    /* 数据表 */
    .table-list { display: flex; flex-direction: column; gap: 12px; }
    .table-item {
      background: var(--surface);
      border-radius: 12px;
      padding: 18px 20px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .table-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--primary);
      border-radius: 12px 0 0 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .table-item:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 20px rgba(79,70,229,0.12);
      transform: translateY(-2px);
    }
    .table-item:hover::before { opacity: 1; }
    .table-item-left { display: flex; align-items: center; gap: 12px; }
    .table-item-icon { width: 36px; height: 36px; background: var(--accent); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .table-item-name { font-weight: 600; }
    .table-item-count { font-size: 12px; color: var(--text-secondary); }
    /* 表单字段 */
    .field-list { display: flex; flex-direction: column; gap: 10px; }
    .field-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-radius: 8px; }
    .field-drag { color: var(--text-secondary); cursor: grab; }
    .field-name { font-weight: 600; flex: 1; }
    .field-type { font-size: 12px; padding: 3px 8px; background: var(--primary-light); color: var(--primary); border-radius: 4px; }
    /* 表格视图 */
    .data-table-wrap { background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th { background: var(--bg); padding: 12px 16px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .data-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .data-table tr:hover td { background: var(--primary-light); }
    /* 统计卡片 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
    .stat-card-value { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-card-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    /* 弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--surface); border-radius: 16px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); padding: 4px; }
    /* 空状态 */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state i { font-size: 48px; margin-bottom: 16px; color: var(--border); }
    .empty-state h3 { margin-bottom: 8px; color: var(--text); }
    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: white; padding: 14px 20px; border-radius: 10px; font-size: 14px; z-index: 2000; box-shadow: 0 4px 16px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--accent); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    /* 移动端适配 */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .admin-layout { flex-direction: column; padding-bottom: 70px; }
      .app-grid { grid-template-columns: 1fr; }
      .topbar { padding: 12px 16px; }
      .show-desktop { display: none !important; }
      .show-mobile { display: block !important; }
    }
    @media (min-width: 769px) {
      .show-mobile { display: none !important; }
    }
      .page-content { padding: 16px; }
      /* 手机底部导航 */
      .mobile-nav {
        display: flex !important;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: var(--surface);
        border-top: 1px solid var(--border);
        z-index: 1000;
        padding: 8px 0 env(safe-area-inset-bottom, 8px);
        box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      }
      .mobile-nav-item {
        flex: 1; text-align: center;
        padding: 6px 4px; cursor: pointer;
        font-size: 11px; color: var(--text-secondary);
        display: flex; flex-direction: column;
        align-items: center; gap: 3px;
        text-decoration: none;
        transition: color 0.2s;
      }
      .mobile-nav-item i { font-size: 20px; }
      .mobile-nav-item.active { color: var(--primary); }
      .modal { border-radius: 20px 20px 0 0; max-width: 100%; margin: 0; }
      .modal-overlay { align-items: flex-end; }
      .btn { min-height: 44px; font-size: 15px; }
      input, select, textarea { min-height: 44px; font-size: 16px; }
      .form-group { margin-bottom: 16px; }
      .table-item { flex-direction: column; gap: 8px; padding: 14px; }
      /* 桌面表格隐藏，手机卡片显示 */
      .desktop-table { display: none !important; }
      .record-cards { display: flex !important; }
    }
    @media (min-width: 769px) {
      .desktop-table { display: block !important; }
      .record-cards { display: none !important; }
    }
    .mobile-nav { display: none; }
    /* 修复iOS安全区 */
    :root {
      safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (max-width: 768px) {
      .auth-card { border-radius: 24px 24px 0 0; padding: 32px 24px; max-width: 100%; margin-top: auto; }
      .auth-page { height: 100vh; flex-direction: column; justify-content: flex-end; }
    }
    /* 搜索框 */
    .search-wrap { position: relative; flex: 1; max-width: 300px; }
    .search-wrap input { width: 100%; padding: 10px 14px 10px 40px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s; background: var(--surface); }
    .search-wrap input:focus { border-color: var(--primary); }
    .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
    .record-count-badge { background: var(--primary-light); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .desktop-table { box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .desktop-table tbody tr:hover { background: var(--primary-light) !important; }
    .desktop-table tbody tr { cursor: pointer; }
    .record-cards > div { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); transition: all 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .record-cards > div:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(79,70,229,0.1); transform: translateY(-1px); }
    /* 个人中心 */
    .profile-view { padding: 24px 16px; height: 100%; display: flex; flex-direction: column; }
    .profile-card { text-align: center; padding: 32px 16px; background: var(--primary); border-radius: 20px; color: #fff; margin-bottom: 24px; }
    .profile-avatar { width: 72px; height: 72px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; margin: 0 auto 12px; }
    .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .profile-email { font-size: 13px; opacity: 0.8; }
    .profile-section { }
    .profile-section-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
    .profile-item { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); cursor: pointer; font-size: 15px; transition: all 0.15s; }
    .profile-item:hover { border-color: var(--primary); background: var(--primary-light); }
    .profile-item.danger { color: var(--danger); margin-top: 8px; }
    .profile-item.danger:hover { border-color: var(--danger); background: #fef2f2; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    if (localStorage.getItem('lingda_dark') === '1') {
      document.body.classList.add('dark-mode');
    }
  </script>
  <script src="/node_modules/vue/dist/vue.global.prod.js"></script>
  <script src="/node_modules/axios/dist/axios.min.js"></script>
  <script src="app3.js"></script>
</body>
</html>
